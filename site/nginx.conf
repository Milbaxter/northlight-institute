server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/northlight/sites/northlight;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    root /srv/northlight/sites/northlight;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/80.47.227.4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/80.47.227.4/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
}
