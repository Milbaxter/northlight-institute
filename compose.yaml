name: northlight
services:
  gateway:
    image: ghcr.io/openclaw/openclaw:2026.9.6
    user: "1000:1000"
    env_file: /etc/northlight/secrets.env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Europe/Helsinki
    volumes:
      - /srv/northlight/state:/home/node/.openclaw
      - /srv/northlight/auth:/home/node/.config/openclaw
      - /srv/northlight/ssh:/home/node/.ssh:ro
    ports:
      - "127.0.0.1:18789:18789"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    mem_limit: 2500m
    cpus: 1.8
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
